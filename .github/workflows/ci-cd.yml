name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-save html-validate@9

      - name: Validar HTML
        run: npx html-validate index.html

      - name: Verificar arquivos referenciados (src/href)
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | cut -d'"' -f2 | sort -u); do
            [ -f "$f" ] || { echo "Arquivo não encontrado: $f"; missing=1; }
          done
          exit $missing

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
