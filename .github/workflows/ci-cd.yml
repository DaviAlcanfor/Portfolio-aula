name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar ambiente (GitHub Pages)
        uses: actions/configure-pages@v6

      # Site estatico (HTML + CSS): nao ha dependencias para instalar.

      - name: Verificar arquivos referenciados no index.html
        run: |
          test -f index.html
          missing=0
          for f in $(grep -oE '(src|href)="[^"#:]+"' index.html | cut -d'"' -f2 | sort -u); do
            [ -f "$f" ] || { echo "Arquivo nao encontrado: $f"; missing=1; }
          done
          exit $missing

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  cd:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
